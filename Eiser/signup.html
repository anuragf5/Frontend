<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="signup_container">
        <div class="container">
            <h3>Signup</h3>
    
            <form action="" class="signup_form">
    
                <div class="signup_email">
                    <input type="email" name="" id="" placeholder="Email">
                </div>
    
                <div class="signup_password">
                    <input type="password" name="" id="" placeholder="Password">
                </div>

                <div class="signup_confirm_password">
                    <input type="password" name="" id="" placeholder="Confirm Password">
                </div>
    
                <button type="submit" class="btn_signup">Signup</button>
    
                <p>Already have an account? <span>Signup</span></p>
    
                <button type="submit" class="btn_facebook">Login with Facebook</button>
    
                <button type="submit" class="btn_google">Login with Google</button>
    
            </form>
    
        </div>
    
    </div>
</body>
</html>
