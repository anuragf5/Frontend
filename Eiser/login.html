<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="login_container">
        <div class="container">
            <h3>Login</h3>

            <form action="" class="login_form">

                <div class="login_email">
                    <input type="email" name="" id="" placeholder="Email">
                </div>

                <div class="login_password">
                    <input type="password" name="" id="" placeholder="Password">
                </div>

                <div class="remember_container">

                    <span><input type="checkbox"> <label for="">Remember me</label></span>

                    <p>Forgot Password?</p>

                </div>

                <button type="submit" class="btn_login">Login</button>

                <p>Don't have an account? <span>Signup</span></p>

                <button type="submit" class="btn_facebook">Login with Facebook</button>
                
                <button type="submit" class="btn_google">Login with Google</button>

            </form>

        </div>

    </div>
</body>

</html>
