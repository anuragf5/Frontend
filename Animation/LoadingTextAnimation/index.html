<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }

        .container {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: black;
        }

        .l,
        .o,
        .a,
        .d,
        .i,
        .n,
        .g {
            /* position: absolute; */
            margin-right: 16px;
            color: white;
            font-size: 24px;
        }

        .l {
            animation-name: l;
            animation-duration: 1.5s;
            animation-iteration-count: infinite;
            animation-timing-function: linear;
            animation-direction: alternate;
            animation-delay: .2s;
        }

        .o {
            animation-name: o;
            animation-duration: 1.5s;
            animation-iteration-count: infinite;
            animation-timing-function: linear;
            animation-direction: alternate;
            animation-delay: .4s;

        }

        .a {
            animation-name: a;
            animation-duration: 1.5s;
            animation-iteration-count: infinite;
            animation-timing-function: linear;
            animation-direction: alternate;
            animation-delay: .6s;
        }

        .d {
            animation-name: d;
            animation-duration: 1.5s;
            animation-iteration-count: infinite;
            animation-timing-function: linear;
            animation-direction: alternate;
            animation-delay: .8s;
        }

        .i {
            animation-name: i;
            animation-duration: 1.5s;
            animation-iteration-count: infinite;
            animation-timing-function: linear;
            animation-direction: alternate;
            animation-delay: 1s;
        }

        .n {
            animation-name: n;
            animation-duration: 1.5s;
            animation-iteration-count: infinite;
            animation-timing-function: linear;
            animation-direction: alternate;
            animation-delay: 1.2s;
        }

        .g {
            animation-name: g;
            animation-duration: 1.5s;
            animation-iteration-count: infinite;
            animation-timing-function: linear;
            animation-direction: alternate;
            animation-delay: 1.4s;
        }

        @keyframes l {
            0% {
                opacity: 0;
                filter: blur(4px);
            }

            100% {
                opacity: 1;
                filter: blur(0px);
            }
        }

        @keyframes o {
            0% {
                opacity: 0;
                filter: blur(4px);
            }

            100% {
                opacity: 1;
                filter: blur(0px);
            }
        }

        @keyframes a {
            0% {
                opacity: 0;
                filter: blur(4px);
            }

            100% {
                opacity: 1;
                filter: blur(0px);
            }
        }

        @keyframes d {
            0% {
                opacity: 0;
                filter: blur(4px);
            }

            100% {
                opacity: 1;
                filter: blur(0px);
            }
        }

        @keyframes i {
            0% {
                opacity: 0;
                filter: blur(4px);
            }

            100% {
                opacity: 1;
                filter: blur(0px);
            }
        }

        @keyframes n {
            0% {
                opacity: 0;
                filter: blur(4px);
            }

            100% {
                opacity: 1;
                filter: blur(0px);
            }
        }

        @keyframes g {
            0% {
                opacity: 0;
                filter: blur(4px);
            }

            100% {
                opacity: 1;
                filter: blur(0px);
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1 class="l">L</h1>
        <h1 class="o">O</h1>
        <h1 class="a">A</h1>
        <h1 class="d">D</h1>
        <h1 class="i">I</h1>
        <h1 class="n">N</h1>
        <h1 class="g">G</h1>
    </div>
</body>

</html>
