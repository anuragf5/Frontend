<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three Dots Loading</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .container {
            background-color: black;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .box1 {
            margin: 10px;
            height: 20px;
            width: 20px;
            background-color: aqua;
            border-radius: 100%;
            animation-name: one;
            animation-duration: .6s;
            animation-iteration-count: infinite;
            animation-timing-function: ease-in;
            animation-direction: alternate;
            /* animation-delay: 2s; */
        }

        @keyframes one {
            0% {
                transform: scale(0);
            }

            100% {
                transform: scale(1);

            }
        }


        .box2 {
            margin: 10px;
            height: 20px;
            width: 20px;
            background-color: aqua;
            border-radius: 100%;
            animation-name: two;
            animation-duration: .6s;
            animation-iteration-count: infinite;
            animation-timing-function: ease-in;
            animation-direction: alternate;
            animation-delay: .2s;
        }

        @keyframes two {
            0% {
                transform: scale(0);
            }

            100% {
                transform: scale(1);
            }
        }

        .box3 {
            margin: 10px;
            height: 20px;
            width: 20px;
            background-color: aqua;
            border-radius: 100%;
            animation-name: three;
            animation-duration: .6s;
            animation-iteration-count: infinite;
            animation-timing-function: ease-in;
            animation-direction: alternate;
            animation-delay: .4s;
        }

        @keyframes three {
            0% {
                transform: scale(0);
            }

            100% {
                transform: scale(1);
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="box1"></div>
        <div class="box2"></div>
        <div class="box3"></div>
    </div>
</body>

</html>
