<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@100..800&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }

        .container {
            height: 100vh;
            background-color: #FAFAF9;
        }

        .card {
            /* position: relative; */
            /* top: 25%; */
            transform: translateY(50%);
            vertical-align: middle;
            width: 368px;
            margin: auto;
            background-color: #FFFFFF;
            border-radius: 8px;
            box-shadow: 0px 30px 100px 0px rgba(17, 23, 41, 0.1);
        }

        .card img {
            width: 336px;
            border-radius: 8px;
            margin: 16px;
        }

        button {
            margin-left: 16px;
            margin-bottom: 16px;
            padding: 6px 16px;
            background-color: #E6D6Fc;
            color: #883AE1;
            border: none;
            border-radius: 50px;
            font-family: "Sora", sans-serif;
        }

        h3 {
            margin-left: 16px;
            margin-bottom: 6px;
            font-family: "Sora", sans-serif;
            font-size: 1.125rem;
            color: #20293A;
        }

        hr {
            margin-bottom: 20px;
            color: #E5EAF0;
        }

        .content {
            margin-left: 16px;
            margin-right: 16px;
            margin-bottom: 20px;
            font-family: "Sora", sans-serif;
            font-size: 0.875rem;
            color: #6C727F;
        }

        .name {
            margin-left: 16px;
            padding-bottom: 16px;
            font-family: "Sora", sans-serif;
            font-size: 0.75rem;
            color: #6C727F;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="card">

            <img src="Images/cactus_img.jpg" alt="">

            <button type="submit">Design</button>

            <h3>Embracing Minimalism</h3>

            <div class="content">

                <p>From minimalist sculptures to minimalist paintings, this blog will inspire you to appreciate the
                    beauty
                    that lies in
                    simplicity.</p>

            </div>

            <hr>

            <div class="name">

                <p>Annie Spratt</p>

            </div>

        </div>


    </div>

</body>

</html>
